# netdata 轻量化配置（512MB 内存设备）
# 原则：RAM 模式短历史，不落盘、关机器学习、关云功能，控制常驻内存 < 80MB

[global]
	# 不作为中心节点收集其他节点数据
	memory limit = 256 MB

[db]
	# 纯内存模式，重启后清零（省去 dbengine 落盘与页缓存）
	mode = ram
	# 保留 2 小时秒级历史
	history = 7200

[ml]
	# 关闭机器学习（省内存大头）
	enabled = no

[cloud]
	# 关闭 Netdata Cloud
	enabled = no

[web]
	# 不绑定外部访问时保持默认；LuCI 面板通过 19999 端口访问
