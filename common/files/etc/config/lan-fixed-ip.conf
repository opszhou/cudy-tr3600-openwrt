# 固定末位规则 —— 由 /usr/sbin/lan-fixed-ip 读写
#
# 每行一条：  <末位> <MAC> [主机名]
# 含义：该 MAC 永远拿到「当前 LAN 网段」的最后一段 = 末位的地址。
#   网段 192.168.5.0/24  ->  192.168.5.10
#   网段 10.0.0.0/24     ->  10.0.0.10
# 改网段后 LAN 重新 up 即自动生效，不需要手工改 IP。
#
# ⛔ 仓库里保持本文件为空：MAC 是单台硬件的身份，通用固件不该绑定。
#    在设备上用命令添加，写在 /etc/config/ 下会被 sysupgrade 保留，重刷不丢：
#
#      lan-fixed-ip add <MAC> <末位> [主机名]
#      lan-fixed-ip add --from-lease <主机名|当前IP> <末位>
#      lan-fixed-ip list
#      lan-fixed-ip del <MAC|末位>
#
# 这是纯文本规则文件（不是 uci 配置），不要用 uci 命令去改它。
