# 设备元数据 —— 蜂助手 FZS 5GCPE P3（MT7981B + MT7531 + SPI-NAND 128MiB + 256MiB RAM）
#
# 上游决策（2026-11 二次调整）：走 **immortalwrt 的 openwrt-25.12 分支**。
#   - 版本仍锁 release 分支（内核 6.12、apk 包管理），不跟 main/master 的滚动 SNAPSHOT：
#     滚动分支版本号漂移、依赖常断，CI 不可复现
#   - 从 openwrt/openwrt 换到 immortalwrt/immortalwrt 的唯一原因是 **nftables 全锥形 NAT**：
#     官方 openwrt 没有任何 feed 提供实现 `option fullcone` 的内核模块（选项存在但永远不生效）；
#     immortalwrt 自带完整三件套（fullconenat-nft 包 + libnftnl 补丁 + firewall4 补丁），
#     且已适配 25.12 的 libnftnl 1.3.1
#   - 两个仓库的 openwrt-25.12 分支同基线：内核都是 6.12，本设备补丁的三个锚点
#     （filogic.mk / 02_network / 新增 dts）在 immortalwrt 侧上下文完全一致，可原样应用
# 注意：补丁目录 patches/openwrt-25.12/ 不随上游改名 —— release 分支名本身唯一确定基线，
#       换上游不该让整份补丁栈找不到（规则见 scripts/apply-device-patches.sh）
id: fzs_5gcpe-p3
target: mediatek/filogic
profile: fzs_5gcpe-p3               # CONFIG_TARGET_..._DEVICE_<profile>，见 default.seed
branch: openwrt-25.12               # 上游分支（immortalwrt 沿用 openwrt 的分支命名）

# 设备默认上游：workflow inputs 留空时用它，避免每次派发漏传参数而编成 openwrt 源。
# 本设备无需合并任何官方 PR：移植补丁直接入库（devices/fzs_5gcpe-p3/patches/openwrt-25.12/）
upstream_owner: immortalwrt
upstream_repo: immortalwrt
default_prs:
