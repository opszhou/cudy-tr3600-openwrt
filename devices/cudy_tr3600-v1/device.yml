# 设备元数据 —— 新增路由器时复制本目录改名，修改以下字段即可
id: cudy_tr3600-v1
target: mediatek/filogic            # OpenWrt target/subtarget
profile: cudy_tr3600-v1             # CONFIG_TARGET_..._DEVICE_<profile>，见 default.seed
branch: main                        # 上游 OpenWrt 分支；补丁目录须对应 patches/openwrt-<branch>

# 「合并官方 PR」工作流未手动填 PR 号时默认合并的 PR
# 注意：24581 与 25860 都是 TR3600 设备支持 PR，互斥，只能启用其一
# ⚠️ 本列表仅对 **openwrt** 上游生效；immortalwrt 不支持从这里拉 PR，
#    它的设备补丁是 devices/<设备>/patches/immortalwrt-*/ 下的静态补丁
default_prs:
  - 25860                           # mediatek: add Cudy TR3600 v1 support（目标 main；实测对最新 main 干净应用）
  # - 24581                         # 备选: add support for Cudy TR3600 v1（实测对最新 main 的 02_network 冲突，待 PR 作者 rebase）
  # ⚠️ 25996（RTL8221B EEE）不要再放进来：上游 main 已吸收该修复，
  #    对应改动已并入 1pr25860.patch（给 TR3600 自身 phy1 加 eee-broken-*）。
  #    重新拉它会 3-way 冲突并让「合并官方 PR」失败（run#34 实测）。

# 分支组合备忘：
#   main         + 25860（或互斥的 24581）
#   openwrt-25.12 + 24596（稳定分支 backport；25.12 下注释掉上面两个 main 专属 PR）
