# 出包前的产物审计期望值（scripts/audit-image.sh 读取）
# TR3600 = MT7987B + MT7990，⛔ 没有 MT7981 的 kmod-mt7915e / mt7981-wo-firmware
REQUIRED_PKGS="qmodem luci-app-qmodem-next kmod-usb3 luci-i18n-base-zh-cn ksmbd-server luci-app-ksmbd"
# ubi 分区 0xE840000 = 232 MiB（见 devices/cudy_tr3600-v1/patches/.../1pr25860.patch 的分区表）
MAX_MIB=232
