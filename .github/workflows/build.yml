name: "🚀 编译固件 (Build OpenWrt)"

on:
  workflow_dispatch:
    inputs:
      device:
        description: "设备ID（devices/ 目录名）"
        required: true
        default: "cudy_tr3600-v1"
      profile:
        description: "包组合 (lite=精简实用 / ultimate=全能)"
        required: true
        default: "lite"
        type: choice
        options:
          - lite
          - ultimate
      build_all_profiles:
        description: "忽略上方组合，lite + ultimate 两个一起编译"
        type: boolean
        default: false
      upstream_owner:
        description: "上游仓库 Owner"
        default: "openwrt"
      upstream_repo:
        description: "上游仓库名"
        default: "openwrt"
      upstream_branch:
        description: "上游分支（留空则使用 device.yml 的 branch）"
        default: ""
      extra_prs:
        description: "临时追加合并的官方 PR 号（空格分隔，仅本次构建不入库）"
        default: ""
      build_all:
        description: "忽略上方设备，编译 devices/ 下全部设备"
        type: boolean
        default: false
      create_release:
        description: "编译成功后创建 Release（lite+ultimate 汇总到同一个 Release，只发裸固件）"
        type: boolean
        default: true

permissions:
  contents: write

# 整个仓库同时只允许一个构建 run（后来的排队等待，不取消进行中的）。
# matrix job 已串行（max-parallel: 1），这里再加 run 级闸门，杜绝多 run 并行占资源。
concurrency:
  group: build-${{ github.repository }}
  cancel-in-progress: false

jobs:
  matrix:
    runs-on: ubuntu-latest
    outputs:
      jobs: ${{ steps.set.outputs.jobs }}
    steps:
      - uses: actions/checkout@v5
      - id: set
        run: |
          if [ "${{ inputs.build_all }}" = "true" ]; then
            DEVICES=$(bash scripts/list-devices.sh --json)
          else
            DEVICES='["${{ inputs.device }}"]'
          fi
          if [ "${{ inputs.build_all_profiles }}" = "true" ]; then
            PROFILES='["lite","ultimate"]'
          else
            PROFILES='["${{ inputs.profile }}"]'
          fi
          JOBS=$(jq -nc --argjson d "$DEVICES" --argjson p "$PROFILES" \
            '[ $d[] as $dev | $p[] as $prof | {device: $dev, profile: $prof} ]')
          echo "设备×组合矩阵: $JOBS"
          echo "jobs=$JOBS" >> "$GITHUB_OUTPUT"

  build:
    needs: matrix
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include: ${{ fromJSON(needs.matrix.outputs.jobs) }}
    steps:
      - name: 挂载大空间构建目录
        uses: easimon/maximize-build-space@master
        with:
          # 根分区须容得下：runner 本体+diag 日志+apt 安装（ubuntu-latest 已迁移 Ubuntu 26，
          # 新镜像布局更大；run#15 lite job 曾因 8GB 预留被写爆、runner No space left 暴毙）
          root-reserve-mb: 14336
          swap-size-mb: 1024
          remove-dotnet: "true"
          remove-android: "true"
          remove-haskell: "true"
          remove-codeql: "true"
          remove-docker-images: "true"

      - name: 安装编译依赖
        run: |
          export TMPDIR=$RUNNER_TEMP
          sudo mkdir -p $TMPDIR
          sudo apt-get clean
          sudo rm -rf /var/lib/apt/lists/* /var/cache/apt/*
          # 输出压缩成事件：成功只留一行摘要，失败才倒出错误行（apt 的 Setting up/Unpacking 行全是噪音）
          sudo apt-get update -y > "$RUNNER_TEMP/apt-update.log" 2>&1 || { tail -20 "$RUNNER_TEMP/apt-update.log"; exit 1; }
          echo "✅ apt update 完成"
          # apt 缓存目录指到大容量数据盘（只有工作区目录挂在 LVM 上，RUNNER_TEMP 仍在根分区）
          sudo mkdir -p "$GITHUB_WORKSPACE/.apt-archives/partial"
          if ! sudo apt-get install -y --no-install-recommends \
            -o Dir::Cache::archives="$GITHUB_WORKSPACE/.apt-archives" \
            ack antlr3 asciidoc autoconf automake autopoint binutils bison build-essential \
            bzip2 ccache clang cmake cpio curl device-tree-compiler flex gawk gcc-multilib \
            g++-multilib gettext genisoimage git gperf haveged help2man intltool \
            libc6-dev-i386 libelf-dev libfuse-dev libglib2.0-dev libgmp3-dev libltdl-dev \
            libmpc-dev libmpfr-dev libncurses5-dev libncursesw5-dev libpython3-dev \
            libreadline-dev libssl-dev libtool llvm lrzsz libnsl-dev ninja-build p7zip \
            p7zip-full patch pkgconf python3 python3-pyelftools python3-setuptools \
            qemu-utils rsync scons squashfs-tools subversion swig texinfo uglifyjs \
            upx-ucl unzip vim wget xmlto xxd zlib1g-dev \
            > "$RUNNER_TEMP/apt-install.log" 2>&1; then
            echo "错误: apt 安装编译依赖失败:" >&2
            grep -aE "^E:|No space left" "$RUNNER_TEMP/apt-install.log" | head -20 >&2
            exit 1
          fi
          echo "✅ 编译依赖安装完成（$(grep -ac '^Setting up' "$RUNNER_TEMP/apt-install.log" || true) 个包）"
          sudo apt-get clean
          sudo rm -rf /var/lib/apt/lists/* /var/cache/apt/* "$GITHUB_WORKSPACE/.apt-archives"

      - name: Checkout 本仓库
        uses: actions/checkout@v5

      - name: 解析设备配置
        run: |
          eval "$(bash scripts/parse-device.sh . "${{ matrix.device }}")"
          BRANCH="${{ inputs.upstream_branch }}"
          [ -n "$BRANCH" ] || BRANCH="${DEV_BRANCH:-main}"
          {
            echo "DEV_BRANCH=$BRANCH"
            echo "UPSTREAM_OWNER=${{ inputs.upstream_owner }}"
            echo "UPSTREAM_REPO=${{ inputs.upstream_repo }}"
          } >> "$GITHUB_ENV"

      - name: Checkout 上游 OpenWrt
        uses: actions/checkout@v5
        with:
          repository: ${{ env.UPSTREAM_OWNER }}/${{ env.UPSTREAM_REPO }}
          ref: ${{ env.DEV_BRANCH }}
          path: openwrt
          fetch-depth: 0

      - name: 缓存 ccache
        uses: actions/cache@v5
        with:
          path: openwrt/.ccache
          key: ccache-${{ matrix.device }}-${{ env.DEV_BRANCH }}-${{ hashFiles('devices/**', 'common/**') }}
          restore-keys: |
            ccache-${{ matrix.device }}-${{ env.DEV_BRANCH }}-
            ccache-${{ matrix.device }}-

      - name: 组装并编译
        run: |
          set -o pipefail
          # 三通道日志：控制台全量（GitHub step 日志）+ 完整日志流式 gzip（省 ~90% 磁盘）
          # + 错误行明文摘要（--line-buffered 防止 grep 缓冲吞尾行）
          ERRPAT='ERROR: package/|Download failed|failed to build|\*\*\* \[[^]]*\] Error|make.*Error [0-9]|错误:'
          bash scripts/build-device.sh . "${{ matrix.device }}" "${{ matrix.profile }}" \
            openwrt "${{ env.UPSTREAM_OWNER }}" "${{ env.UPSTREAM_REPO }}" "${{ inputs.extra_prs }}" \
            2>&1 | tee >(gzip -c > build-output.log.gz) \
                      >(grep --line-buffered -aE "$ERRPAT" > build-errors.log)

      - name: 构建摘要（无论成败，写入 Summary 页）
        if: always()
        run: |
          {
            echo "## 构建摘要：${{ matrix.device }} / ${{ matrix.profile }}（run ${{ github.run_number }}）"
            echo
            if [ -s build-errors.log ]; then
              echo "### ⚠️ 构建输出中的错误行（末 50 行，完整日志见 diag artifact 的 build-output.log.gz）"
              echo '```'
              tail -50 build-errors.log
              echo '```'
            else
              echo "✅ 构建输出无错误行"
            fi
            if compgen -G "openwrt/bin/targets/*/*" > /dev/null; then
              echo
              echo "### 产物"
              echo '```'
              ls -lh openwrt/bin/targets/*/
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          # 同步打印到 job 日志（Summary 页在 run 页面，job 日志在 job 页面，两处都能看）
          if [ -s build-errors.log ]; then
            echo "==== 构建输出中的错误行（完整日志见 build-output.log.gz）===="
            tail -50 build-errors.log
          else
            echo "构建输出无错误行"
          fi

      - name: 包清单对比与存档（成功时，写入 Summary 页）
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          NAME: ${{ matrix.device }}-${{ matrix.profile }}.manifest
        run: |
          MF=$(find openwrt/bin/targets -name '*.manifest' | head -n1)
          if [ -z "$MF" ]; then echo "未找到 manifest，跳过包清单对比"; exit 0; fi

          # 与上次成功构建存档的 manifest（build-manifests 分支）对比
          OLD=$(gh api "repos/$REPO/contents/manifests/$NAME?ref=build-manifests" --jq '.content' 2>/dev/null | base64 -d || true)
          if [ -n "$OLD" ]; then
            {
              echo
              echo "### 📦 包清单变更（相对上次成功构建）"
              echo '```diff'
              diff <(printf '%s\n' "$OLD") <(sort "$MF") | grep -E '^[<>]' || echo "（无变化）"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "### 📦 首次存档包清单（$NAME）" >> "$GITHUB_STEP_SUMMARY"
          fi

          # 确保 build-manifests 分支存在（不存在则从 main 创建）
          if ! gh api "repos/$REPO/branches/build-manifests" --jq .name >/dev/null 2>&1; then
            MAIN_SHA=$(gh api "repos/$REPO/git/refs/heads/main" --jq '.object.sha')
            gh api -X POST "repos/$REPO/git/refs" -f ref=refs/heads/build-manifests -f sha="$MAIN_SHA" >/dev/null
          fi
          # 写入/更新存档（build.yml 无 push 触发器，此提交不会引发循环构建）
          FILE_SHA=$(gh api "repos/$REPO/contents/manifests/$NAME?ref=build-manifests" --jq '.sha' 2>/dev/null || true)
          ARGS=(-f message="manifest: run#${{ github.run_number }} ${{ matrix.device }}/${{ matrix.profile }}" \
                -f content="$(base64 -w0 "$MF")" -f branch=build-manifests)
          [ -n "$FILE_SHA" ] && ARGS+=(-f sha="$FILE_SHA")
          gh api -X PUT "repos/$REPO/contents/manifests/$NAME" "${ARGS[@]}" >/dev/null
          echo "manifest 已存档到 build-manifests 分支: manifests/$NAME"

      - name: 上传错误摘要（无论成败）
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: errors-${{ matrix.device }}-${{ matrix.profile }}-run${{ github.run_number }}
          path: build-errors.log
          retention-days: 7
          if-no-files-found: ignore

      - name: 上传构建诊断（仅失败时）
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: diag-${{ matrix.device }}-${{ matrix.profile }}-run${{ github.run_number }}
          path: |
            build-output.log.gz
            build-errors.log
            openwrt/.config
            openwrt/feeds.conf.default
          retention-days: 7
          if-no-files-found: ignore
          include-hidden-files: true

      - name: 上传固件 Artifact
        uses: actions/upload-artifact@v6
        with:
          name: openwrt-${{ matrix.device }}-${{ matrix.profile }}-snapshot
          path: openwrt/bin/targets
          retention-days: 14
          include-hidden-files: true

  # 所有组合（lite/ultimate）跑完后，汇总成「一个」Release：同页、资产以组合名作前缀。
  # 标签：snapshot-<UTC日期>-r<run号>，如 snapshot-20261101-r21。
  release:
    needs: build
    if: ${{ inputs.create_release && success() }}
    runs-on: ubuntu-latest
    steps:
      - name: 下载全部固件 artifact
        uses: actions/download-artifact@v5
        with:
          pattern: openwrt-*-snapshot
          path: fw

      - name: 汇总发布（lite + ultimate 同页）
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          RUN="${{ github.run_number }}"
          TAG="snapshot-$(date -u +%Y%m%d)-r${RUN}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            TAG="${TAG}-a${{ github.run_attempt }}"   # 重跑同一 run 时不撞已有标签
          fi
          mkdir -p assets
          NOTES=$(mktemp)
          {
            echo "本页是**同一次构建（run #${RUN}）的全部固件**：lite 与 ultimate 都在这里，资产以组合名作前缀。"
            echo
            echo "| 组合 | 设备 | 主固件 | 包数量 |"
            echo "| --- | --- | --- | --- |"
          } > "$NOTES"

          for d in fw/*/; do
            A=$(basename "$d")                         # openwrt-<device>-<profile>-snapshot
            X=${A#openwrt-}; X=${X%-snapshot}
            PROF=${X##*-}; DEV=${X%-*}
            while IFS= read -r f; do
              cp -f "$f" "assets/${PROF}-$(basename "$f")"
            done < <(find "$d" -type f ! -path "*/packages/*" \
                       \( -name 'openwrt-*.bin' -o -name 'openwrt-*.itb' -o -name 'openwrt-*.img' \
                          -o -name 'openwrt-*.manifest' -o -name '*.buildinfo' \) | sort)
            SYS=$(find "$d" -name 'openwrt-*-sysupgrade.bin' -printf '%f\n' 2>/dev/null | head -n1)
            MF=$(find "$d" -name 'openwrt-*.manifest' | head -n1)
            PKG=$( [ -n "$MF" ] && grep -c . "$MF" || echo "?" )
            echo "| ${PROF} | ${DEV} | \`${PROF}-${SYS:-无}\` | ${PKG} |" >> "$NOTES"
          done

          ( cd assets && sha256sum * > sha256sums )

          cat >> "$NOTES" <<'MD'

          ### 两个组合怎么选
          - **lite**：精简实用——路由本职 + 常用网络工具 + 中文界面 + QModem 蜂窝支持
          - **ultimate**：全能——额外含 docker、各类插件与诊断工具，体积更大、开机更慢

          ### 刷机步骤（务必按顺序）
          1. 原厂固件 → 先刷 Cudy 官方**中间固件**（见 Cudy 下载页说明），**不要**直接刷 OpenWrt
          2. 进入 OpenWrt 后，用「系统 → 备份/升级」刷入 `<组合>-openwrt-…-sysupgrade.bin`
          3. 救砖：`<组合>-openwrt-…-initramfs-kernel.bin` 可引导进内存系统抢救

          ### 校验
          ```
          sha256sum -c sha256sums
          ```

          ### 包含内容
          - `*-sysupgrade.bin`：主固件（OpenWrt 内升级/刷机）
          - `*-initramfs-kernel.bin`：救砖 / 内存调试
          - `*.manifest`：包清单（纯文本，精确到每个包的版本）
          - `*.buildinfo`：构建配置与 feed 版本（可复现）
          - 不提供压缩包，也不提供 `packages/*.apk`

          ### ⚠️ 声明
          本项目为**个人自用构建**，未经系统性真机验证，仅适配 Cudy TR3600 v1。刷机有变砖风险，后果自担。
          MD

          echo "== 待发布资产 ==" ; ls -lh assets
          gh release create "$TAG" assets/* \
            --title "快照 ${RUN} · $(date -u +%Y-%m-%d)" \
            --notes-file "$NOTES" --latest
          echo "已发布: https://github.com/${{ github.repository }}/releases/tag/$TAG"
