name: "🚀 编译固件 (Build OpenWrt)"

on:
  workflow_dispatch:
    inputs:
      device:
        description: "设备ID（devices/ 目录名）"
        required: true
        default: "cudy_tr3600-v1"
      profile:
        description: "包组合 (lite=精简实用 / ultimate=全能)"
        required: true
        default: "lite"
        type: choice
        options:
          - lite
          - ultimate
      build_all_profiles:
        description: "忽略上方组合，lite + ultimate 两个一起编译"
        type: boolean
        default: false
      upstream_owner:
        description: "上游仓库 Owner"
        default: "openwrt"
      upstream_repo:
        description: "上游仓库名"
        default: "openwrt"
      upstream_branch:
        description: "上游分支（留空则使用 device.yml 的 branch；决定补丁目录）"
        default: ""
      upstream_ref:
        description: "上游 checkout 的具体 ref（tag/commit，可留空；填 v25.12.6 这类 tag 可出稳定版本号）"
        default: ""
      extra_prs:
        description: "临时追加合并的官方 PR 号（空格分隔，仅本次构建不入库）"
        default: ""
      build_all:
        description: "忽略上方设备，编译 devices/ 下全部设备"
        type: boolean
        default: false
      create_release:
        description: "编译成功后创建 Release（lite+ultimate 汇总到同一个 Release，只发裸固件）"
        type: boolean
        default: true
      with_qmanager:
        description: "启用 QManager 载荷（Quectel 专用独立 Web 控制台；与 QModem 拨号二选一，默认关）"
        type: boolean
        default: false

permissions:
  contents: write

# 整个仓库同时只允许一个构建 run（后来的排队等待，不取消进行中的）。
# matrix job 已串行（max-parallel: 1），这里再加 run 级闸门，杜绝多 run 并行占资源。
concurrency:
  group: build-${{ github.repository }}
  cancel-in-progress: false

jobs:
  matrix:
    runs-on: ubuntu-24.04
    outputs:
      jobs: ${{ steps.set.outputs.jobs }}
    steps:
      - uses: actions/checkout@v5
      - id: set
        run: |
          if [ "${{ inputs.build_all }}" = "true" ]; then
            DEVICES=$(bash scripts/list-devices.sh --json)
          else
            DEVICES='["${{ inputs.device }}"]'
          fi
          if [ "${{ inputs.build_all_profiles }}" = "true" ]; then
            PROFILES='["lite","ultimate"]'
          else
            PROFILES='["${{ inputs.profile }}"]'
          fi
          JOBS=$(jq -nc --argjson d "$DEVICES" --argjson p "$PROFILES" \
            '[ $d[] as $dev | $p[] as $prof | {device: $dev, profile: $prof} ]')
          echo "设备×组合矩阵: $JOBS"
          echo "jobs=$JOBS" >> "$GITHUB_OUTPUT"

  build:
    needs: matrix
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include: ${{ fromJSON(needs.matrix.outputs.jobs) }}
    steps:
      - name: 评估根分区空间（决定是否需要 LVM 扩容）
        id: space
        run: |
          sudo df -h / /mnt 2>/dev/null || sudo df -h /
          FREE_GB=$(df --block-size=1G --output=avail / | tail -1 | tr -d ' ')
          echo "根分区可用: ${FREE_GB}G"
          if [ "${FREE_GB:-0}" -ge 40 ]; then
            echo "enough=true" >> "$GITHUB_OUTPUT"
            echo "→ 根分区空间充足（≥40G），跳过 LVM 扩容（新镜像 /mnt 与 / 同盘，扩容反而会把根写满）"
          else
            echo "enough=false" >> "$GITHUB_OUTPUT"
            echo "→ 根分区不足，启用 LVM 扩容"
          fi

      - name: 挂载大空间构建目录
        if: steps.space.outputs.enough == 'false'
        uses: easimon/maximize-build-space@master
        with:
          # 仅在根分区偏小（旧镜像，如 24.04 的 14G 根）时启用。
          # 注意：新镜像 /mnt 与 / 同盘，此时该动作会把两个 loop 文件都写到根分区，
          # 反而写满根分区（见 run#24）——所以上面先判断空间，够用就跳过。
          root-reserve-mb: 14336
          swap-size-mb: 1024
          remove-dotnet: "true"
          remove-android: "true"
          remove-haskell: "true"
          remove-codeql: "true"
          remove-docker-images: "true"

      - name: 安装编译依赖
        # 2026-11-11 事故：runner 镜像换代后 apt 源里"什么都找不到"
        #   E: Unable to locate package build-essential / clang / cmake / device-tree-compiler …
        # 连 build-essential 都没候选 —— 说明是镜像源本身不可用（不是包改名）。
        # 这里改成：清空源 → 逐个候选镜像试到 apt-cache 真的能看到 build-essential 为止 → 再装。
        run: |
          set -uo pipefail
          export TMPDIR="$RUNNER_TEMP"
          . /etc/os-release
          CODENAME="${VERSION_CODENAME:-noble}"
          echo "runner: $(lsb_release -ds 2>/dev/null || echo unknown) / codename=$CODENAME"

          try_mirror() {
            local mirror="$1"
            sudo rm -rf /var/lib/apt/lists/* /etc/apt/sources.list.d/* 2>/dev/null || true
            if [ -n "$mirror" ]; then
              sudo sh -c "printf 'deb $mirror $CODENAME main restricted universe multiverse\ndeb $mirror $CODENAME-updates main restricted universe multiverse\n' > /etc/apt/sources.list"
            fi
            sudo apt-get update -y > "$RUNNER_TEMP/apt-update.log" 2>&1 || return 1
            apt-cache policy build-essential 2>/dev/null | grep -q 'Candidate:' || return 1
            return 0
          }

          ok=0
          for m in "" "http://archive.ubuntu.com/ubuntu" "http://azure.archive.ubuntu.com/ubuntu" "https://mirrors.tuna.tsinghua.edu.cn/ubuntu"; do
            echo "== 尝试 apt 源: ${m:-镜像自带}"
            if try_mirror "$m"; then echo "✅ apt 源可用: ${m:-镜像自带}"; ok=1; break; fi
            echo "  ✗ 不可用，换下一个"
          done
          if [ "$ok" -ne 1 ]; then
            echo "错误: 所有 apt 源都不可用（build-essential 无候选），update 日志尾部：" >&2
            tail -20 "$RUNNER_TEMP/apt-update.log" >&2
            exit 1
          fi

          if ! sudo apt-get install -y --no-install-recommends \
            ack antlr3 asciidoc autoconf automake autopoint binutils bison build-essential \
            bzip2 ccache clang cmake cpio curl device-tree-compiler flex gawk gettext genisoimage \
            git gperf haveged libelf-dev libglib2.0-dev libgmp3-dev libltdl-dev libmpc-dev libmpfr-dev \
            libncurses5-dev libncursesw5-dev libpython3-dev libreadline-dev libssl-dev libtool llvm \
            lrzsz libnsl-dev ninja-build p7zip p7zip-full patch pkgconf python3 python3-pyelftools \
            python3-setuptools qemu-utils rsync scons squashfs-tools subversion swig texinfo \
            unzip vim wget xmlto xxd zlib1g-dev \
            > "$RUNNER_TEMP/apt-install.log" 2>&1; then
            echo "错误: 必需依赖安装失败:" >&2
            grep -aE "^E:|No space left|Unable to locate|no installation candidate" "$RUNNER_TEMP/apt-install.log" | head -20 >&2
            exit 1
          fi
          echo "✅ 必需依赖安装完成（@@(grep -ac '^Setting up' "$RUNNER_TEMP/apt-install.log" || true) 个包）"

          # 可选依赖：新版本 Ubuntu 里可能被改名/移除，缺失不影响 aarch64 目标出固件
          sudo apt-get install -y --no-install-recommends \
            help2man intltool libc6-fuse-dev libfuse-dev uglifyjs upx-ucl gcc-multilib g++-multilib \
            > "$RUNNER_TEMP/apt-optional.log" 2>&1 \
            || echo "⚠ 可选依赖有缺失（不影响构建）：@@(grep -aE '^E:' "$RUNNER_TEMP/apt-optional.log" | head -3 | tr '\n' ' ')"
          sudo apt-get clean || true

      - name: Checkout 本仓库
        uses: actions/checkout@v5

      - name: 解析设备配置
        run: |
          eval "$(bash scripts/parse-device.sh . "${{ matrix.device }}")"
          BRANCH="${{ inputs.upstream_branch }}"
          [ -n "$BRANCH" ] || BRANCH="${DEV_BRANCH:-main}"
          # checkout 用哪个 ref：手动指定 > device.yml 的 ref（可为 tag）> 分支名。
          # 补丁目录仍按分支解析，所以"锁 tag 出稳定版"和"跟分支出滚动版"共用同一套补丁。
          REF="${{ inputs.upstream_ref }}"
          [ -n "$REF" ] || REF="${DEV_REF:-}"
          [ -n "$REF" ] || REF="$BRANCH"
          echo "上游 checkout ref: $REF（补丁目录按分支 $BRANCH）"
          {
            echo "DEV_BRANCH=$BRANCH"
            echo "CHECKOUT_REF=$REF"
            echo "UPSTREAM_OWNER=${{ inputs.upstream_owner }}"
            echo "UPSTREAM_REPO=${{ inputs.upstream_repo }}"
          } >> "$GITHUB_ENV"

      - name: Checkout 上游 OpenWrt
        uses: actions/checkout@v5
        with:
          repository: ${{ env.UPSTREAM_OWNER }}/${{ env.UPSTREAM_REPO }}
          ref: ${{ env.CHECKOUT_REF }}
          path: openwrt
          fetch-depth: 0

      - name: 设备移植前置校验（补丁 / 设备树 / 网口映射）
        # 秒级失败闸门：补丁漂移、dts 结构错、02_network 网口映射写错都在这里拦下，
        # 不用等 90 分钟编译。逻辑见 scripts/verify-device.sh（worktree 内校验，不改主树）。
        run: |
          bash scripts/verify-device.sh . openwrt "${{ matrix.device }}" "" "${{ inputs.upstream_repo }}"

      - name: 缓存源码包（dl）
        uses: actions/cache@v5
        with:
          path: openwrt/dl
          # dl 只是源码 tarball 缓存，损坏会自动重新下载，风险极低；
          # 冷缓存时 make download 是整轮耗时大头，命中率接近 100%。
          # key 带月份滚动防无限膨胀（GitHub 按 LRU 自动淘汰）。
          key: dl-${{ env.UPSTREAM_REPO }}-${{ env.DEV_BRANCH }}-202611
          restore-keys: |
            dl-${{ env.UPSTREAM_REPO }}-${{ env.DEV_BRANCH }}-

      - name: 缓存 ccache
        uses: actions/cache@v5
        with:
          path: openwrt/.ccache
          # key 不再掺 hashFiles：ccache 自身按源码内容寻址，配置/清单改动不该让缓存整体失效。
          # （曾因每改一次 common/ 就换 key，导致当天多次构建全部冷编，单次多耗 60~90 分钟）
          # key 带上游名：openwrt 与 immortalwrt 的源码树/编译参数不同，
          # 混用缓存只会白下载（run#30 就拉了 openwrt 的 856MB 缓存，命中率≈0）
          key: ccache-${{ matrix.device }}-${{ env.UPSTREAM_REPO }}-${{ env.DEV_BRANCH }}
          restore-keys: |
            ccache-${{ matrix.device }}-${{ env.UPSTREAM_REPO }}-${{ env.DEV_BRANCH }}-
            ccache-${{ matrix.device }}-${{ env.UPSTREAM_REPO }}-

      - name: 组装并编译
        env:
          # 可选 QManager 载荷：assemble.sh 据此追加 devices/<dev>/configs/qmanager.list
          QMANAGER: ${{ inputs.with_qmanager }}
        run: |
          set -o pipefail
          # 三通道日志：控制台全量（GitHub step 日志）+ 完整日志流式 gzip（省 ~90% 磁盘）
          # + 错误行明文摘要（--line-buffered 防止 grep 缓冲吞尾行）
          ERRPAT='ERROR: package/|Download failed|failed to build|\*\*\* \[[^]]*\] Error|make.*Error [0-9]|错误:'
          bash scripts/build-device.sh . "${{ matrix.device }}" "${{ matrix.profile }}" \
            openwrt "${{ env.UPSTREAM_OWNER }}" "${{ env.UPSTREAM_REPO }}" "${{ inputs.extra_prs }}" \
            2>&1 | tee >(gzip -c > build-output.log.gz) \
                      >(grep --line-buffered -aE "$ERRPAT" > build-errors.log)

      - name: 构建摘要（无论成败，写入 Summary 页）
        if: always()
        run: |
          {
            echo "## 构建摘要：${{ matrix.device }} / ${{ matrix.profile }}（run ${{ github.run_number }}）"
            echo
            if [ -s build-errors.log ]; then
              echo "### ⚠️ 构建输出中的错误行（末 50 行，完整日志见 diag artifact 的 build-output.log.gz）"
              echo '```'
              tail -50 build-errors.log
              echo '```'
            else
              echo "✅ 构建输出无错误行"
            fi
            if compgen -G "openwrt/bin/targets/*/*" > /dev/null; then
              echo
              echo "### 产物"
              echo '```'
              ls -lh openwrt/bin/targets/*/
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          # 同步打印到 job 日志（Summary 页在 run 页面，job 日志在 job 页面，两处都能看）
          if [ -s build-errors.log ]; then
            echo "==== 构建输出中的错误行（完整日志见 build-output.log.gz）===="
            tail -50 build-errors.log
          else
            echo "构建输出无错误行"
          fi

      - name: 包清单对比与存档（成功时，写入 Summary 页）
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          # 必须含上游：否则 openwrt 与 immortalwrt 的清单会互相覆盖（同名文件）
          NAME: ${{ env.UPSTREAM_REPO }}-${{ matrix.device }}-${{ matrix.profile }}.manifest
        run: |
          MF=$(find openwrt/bin/targets -name '*.manifest' | head -n1)
          if [ -z "$MF" ]; then echo "未找到 manifest，跳过包清单对比"; exit 0; fi

          # 与上次成功构建存档的 manifest（build-manifests 分支）对比
          OLD=$(gh api "repos/$REPO/contents/manifests/$NAME?ref=build-manifests" --jq '.content' 2>/dev/null | base64 -d || true)
          if [ -n "$OLD" ]; then
            {
              echo
              echo "### 📦 包清单变更（相对上次成功构建）"
              echo '```diff'
              diff <(printf '%s\n' "$OLD") <(sort "$MF") | grep -E '^[<>]' || echo "（无变化）"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "### 📦 首次存档包清单（$NAME）" >> "$GITHUB_STEP_SUMMARY"
          fi

          # 确保 build-manifests 分支存在（不存在则从 main 创建）
          if ! gh api "repos/$REPO/branches/build-manifests" --jq .name >/dev/null 2>&1; then
            MAIN_SHA=$(gh api "repos/$REPO/git/refs/heads/main" --jq '.object.sha')
            gh api -X POST "repos/$REPO/git/refs" -f ref=refs/heads/build-manifests -f sha="$MAIN_SHA" >/dev/null
          fi
          # 写入/更新存档（build.yml 无 push 触发器，此提交不会引发循环构建）
          FILE_SHA=$(gh api "repos/$REPO/contents/manifests/$NAME?ref=build-manifests" --jq '.sha' 2>/dev/null || true)
          ARGS=(-f message="manifest: run#${{ github.run_number }} ${{ matrix.device }}/${{ matrix.profile }}" \
                -f content="$(base64 -w0 "$MF")" -f branch=build-manifests)
          [ -n "$FILE_SHA" ] && ARGS+=(-f sha="$FILE_SHA")
          gh api -X PUT "repos/$REPO/contents/manifests/$NAME" "${ARGS[@]}" >/dev/null
          echo "manifest 已存档到 build-manifests 分支: manifests/$NAME"

      - name: 上传错误摘要（无论成败）
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: errors-${{ matrix.device }}-${{ matrix.profile }}-run${{ github.run_number }}
          path: build-errors.log
          retention-days: 7
          if-no-files-found: ignore

      - name: 上传构建诊断（仅失败时）
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: diag-${{ matrix.device }}-${{ matrix.profile }}-run${{ github.run_number }}
          path: |
            build-output.log.gz
            build-errors.log
            openwrt/.config
            openwrt/feeds.conf.default
          retention-days: 7
          if-no-files-found: ignore
          include-hidden-files: true

      - name: 产物自检（包清单必装项 + 镜像体积上限）
        # 编译成功 ≠ 刷得进去。这里把两件"事后才发现就晚了"的事卡在出 Artifact 之前：
        #   1) 必装包真的进了镜像（defconfig 通过了，也可能在 package/install 阶段被裁掉）
        #   2) sysupgrade.bin 不超过 ubi 分区上限（P3 是 112 MiB），超了刷机必半死
        if: success()
        run: |
          set -euo pipefail
          MF=$(find openwrt/bin/targets -name '*.manifest' | head -n1)
          [ -n "$MF" ] || { echo "错误: 未找到 manifest"; exit 1; }
          echo "== 必装包核对（$MF）=="
          miss=0
          for p in qmodem luci-app-qmodem-next kmod-mt7915e mt7981-wo-firmware kmod-usb3 luci-i18n-base-zh-cn; do
            if grep -qE "^$p([[:space:]]|\$)" "$MF"; then echo "  OK      $p"; else echo "  MISSING $p"; miss=1; fi
          done
          [ "$miss" -eq 0 ] || { echo "错误: 有必装包缺失"; exit 1; }

          BIN=$(find openwrt/bin/targets -name '*fzs_5gcpe-p3*sysupgrade*.bin' | head -n1 || true)
          [ -n "$BIN" ] || { echo "错误: 未找到 fzs_5gcpe-p3 的 sysupgrade 镜像"; ls -lh openwrt/bin/targets/*/* || true; exit 1; }
          SZ=$(stat -c %s "$BIN")
          echo "== 镜像体积 =="
          echo "  $BIN = $SZ bytes ($((SZ/1024/1024)) MiB)"
          LIMIT=$((112*1024*1024))
          if [ "$SZ" -ge "$LIMIT" ]; then echo "错误: 超过 112 MiB ubi 分区上限"; exit 1; fi
          echo "RESULT: OK"

      - name: 上传固件 Artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.UPSTREAM_REPO }}-${{ matrix.device }}-${{ matrix.profile }}-snapshot
          # .config 一并上传：manifest 少了包时，光看 bin/targets 判断不出是"配置没写进"还是"编译期被丢"，
          # 真正用于编译的 .config 是唯一能定性的证据（config.buildinfo 只是 diffconfig 的差集）。
          path: |
            openwrt/bin/targets
            openwrt/.config
          retention-days: 14
          include-hidden-files: true

  # 所有组合（lite/ultimate）跑完后，汇总成「一个」Release：同页、资产名带组合名。
  # 标签由 publish-release.sh 生成：<上游>-<OpenWrt 版本号>，如 immortalwrt-r42943-89f1ef18c8。
  release:
    needs: build
    if: ${{ inputs.create_release && success() }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: 下载全部固件 artifact
        uses: actions/download-artifact@v7
        with:
          pattern: '*-snapshot'
          path: fw

      - name: 归一化 artifact 目录布局（单 artifact 会平铺到 path）
        # download-artifact 在只匹配到一个 artifact 时直接解压到 fw/（不建 <名字>/ 子目录），
        # 多个 artifact 则各建 <名字>/ 子目录。publish-release.sh 依赖后者，
        # 这里检测到平铺就按 API 查到的 artifact 名补建子目录。
        # v7 与 upload-artifact@v7 配套（同为 node24），行为与旧版一致。
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if compgen -G "fw/*-snapshot" >/dev/null; then
            echo "fw 已是 <artifact>/ 布局，无需归一化"
          else
            NAME=$(gh api "repos/$GH_REPO/actions/runs/${{ github.run_id }}/artifacts" \
              --jq '[.artifacts[].name | select(endswith("-snapshot"))][0]')
            echo "平铺布局，归一化到 fw/$NAME/"
            mkdir -p "fw/$NAME"
            find fw -mindepth 1 -maxdepth 1 ! -path "fw/$NAME" -exec mv {} "fw/$NAME/" \;
          fi
          echo "== fw 布局 =="
          find fw -mindepth 1 -maxdepth 2 -type d | sort

      # 发布逻辑集中在 scripts/publish-release.sh，release.yml 手动补发复用同一份
      - name: 汇总发布（lite + ultimate 同页）
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # 显式给仓库：gh 在缺少 .git 时推断不出仓库（run#27 因此失败）
          GH_REPO: ${{ github.repository }}
          RUN: ${{ github.run_number }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          # 标签前缀按上游区分（immortalwrt 构建不能叫 openwrt-*）
          UPSTREAM_LABEL: ${{ inputs.upstream_repo }}
        run: bash scripts/publish-release.sh
