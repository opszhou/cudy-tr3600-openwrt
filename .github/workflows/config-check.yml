name: "🧪 配置闸门 (Config Check)"
# 只跑「组装 → feeds → defconfig → 审计 → 索引预热复验」，不编译。
# 目的：把"清单里的包有没有真正进入最终 .config"从 3 小时压到 ~10 分钟。
# 背景：2026-11-11 fzs-p3 首轮构建成功，但镜像 manifest 里没有 qmodem/luci-ssl/htop/curl，
#       而按 .config 的写法它们本该在 —— 必须能在几分钟内复现并定位，而不是等一整轮编译。
on:
  workflow_dispatch:
    inputs:
      device:
        description: "设备ID（devices/ 目录名）"
        required: true
        default: "fzs_5gcpe-p3"
      profile:
        description: "包组合"
        required: true
        default: "lite"
        type: choice
        options: [lite, ultimate]
      upstream_branch:
        description: "上游分支（留空用 device.yml；决定补丁目录）"
        default: ""
      upstream_ref:
        description: "上游 checkout 的 ref（tag/commit，可留空）"
        default: ""
      with_qmanager:
        description: "启用 QManager 载荷（验 qmanager-bundle 能否被选中）"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  config-check:
    runs-on: ubuntu-24.04
    steps:
      - name: 安装最小依赖（只要跑得动 Kconfig）
        # 与 build.yml 同款健壮性：runner 镜像换代后 apt 源可能整体不可用（build-essential 都无候选），
        # 这里同样"试多个源 + 验证 build-essential 真能装"再往下走。
        run: |
          set -uo pipefail
          . /etc/os-release
          CODENAME="${VERSION_CODENAME:-noble}"
          try_mirror() {
            local mirror="$1"
            sudo rm -rf /var/lib/apt/lists/* /etc/apt/sources.list.d/* 2>/dev/null || true
            if [ -n "$mirror" ]; then
              sudo sh -c "printf 'deb $mirror $CODENAME main restricted universe multiverse\ndeb $mirror $CODENAME-updates main restricted universe multiverse\n' > /etc/apt/sources.list"
            fi
            sudo apt-get update -y > /tmp/u.log 2>&1 || return 1
            apt-cache policy build-essential 2>/dev/null | grep -qE 'Candidate: [0-9]' || return 1
            return 0
          }
          ok=0
          for m in "" "http://archive.ubuntu.com/ubuntu" "http://azure.archive.ubuntu.com/ubuntu" "https://mirrors.tuna.tsinghua.edu.cn/ubuntu"; do
            echo "== apt 源: ${m:-镜像自带}"
            if try_mirror "$m"; then ok=1; break; fi
            echo "  ✗ 不可用"
          done
          [ "$ok" -eq 1 ] || { echo "错误: 所有 apt 源不可用" >&2; tail -20 /tmp/u.log >&2; exit 1; }
          sudo apt-get install -y -qq --no-install-recommends \
            build-essential bison flex libncurses5-dev libssl-dev zlib1g-dev \
            gawk gettext python3 python3-pyelftools rsync unzip wget git ca-certificates \
            libelf-dev cpio file || { echo "错误: 最小依赖安装失败" >&2; exit 1; }

      - uses: actions/checkout@v5

      - name: 解析设备配置
        run: |
          eval "$(bash scripts/parse-device.sh . "${{ inputs.device }}")"
          BRANCH="${{ inputs.upstream_branch }}"
          [ -n "$BRANCH" ] || BRANCH="${DEV_BRANCH:-main}"
          REF="${{ inputs.upstream_ref }}"
          [ -n "$REF" ] || REF="${DEV_REF:-}"
          [ -n "$REF" ] || REF="$BRANCH"
          echo "DEV_BRANCH=$BRANCH" >> "$GITHUB_ENV"
          echo "CHECKOUT_REF=$REF" >> "$GITHUB_ENV"
          echo "上游分支: $BRANCH   checkout ref: $REF"

      - uses: actions/checkout@v5
        with:
          repository: openwrt/openwrt
          ref: ${{ env.CHECKOUT_REF }}
          path: openwrt
          fetch-depth: 1

      - name: 组装 + defconfig + 审计（CONFIG_ONLY）
        env:
          CONFIG_ONLY: "1"
          QMANAGER: ${{ inputs.with_qmanager }}
        run: |
          bash scripts/verify-device.sh . openwrt "${{ inputs.device }}" "" openwrt
          bash scripts/build-device.sh . "${{ inputs.device }}" "${{ inputs.profile }}" openwrt openwrt openwrt "" "${{ env.DEV_BRANCH }}" 2>&1 | tee config-check.log

      - name: 上传 .config 与日志
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: config-check-${{ inputs.device }}-${{ inputs.profile }}
          path: |
            openwrt/.config
            openwrt/.config.assembled
            config-check.log
          retention-days: 7
          include-hidden-files: true
